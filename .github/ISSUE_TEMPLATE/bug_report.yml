name: Bug report
description: Image fails to start, smoke test fails, or incorrect behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check that you are pulling the latest tag and that your
        DGX Spark firmware is current.

  - type: input
    id: image-tag
    attributes:
      label: Image tag
      placeholder: "v0.20.1-gb10.0"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Image fails to pull / digest mismatch
        - Container crashes on startup
        - vllm serve fails or errors
        - Smoke test failure
        - Wrong package version inside image
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        docker run --rm -it --gpus all --ipc=host --network host \
          ghcr.io/timothystewart6/vllm-gb10:v0.20.1-gb10.0 \
          vllm serve ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: input
    id: spark-firmware
    attributes:
      label: DGX Spark firmware version
      placeholder: "e.g. 1.2.3"
