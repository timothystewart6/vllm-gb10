name: Bug report
description: Image fails to start, smoke test fails, or incorrect behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check that you are pulling the latest tag and that your
        DGX Spark firmware is current.

        This repo builds and ships vLLM - it does not patch upstream behavior.
        If the issue reproduces with the official NGC image or with a plain
        `pip install vllm`, please file it at
        [vllm-project/vllm](https://github.com/vllm-project/vllm/issues) instead.
        Open here only if the issue is specific to this image or the GB10 build.

        Search open and closed issues and pull requests before filing. Include
        the exact release, commit, or Actions run and enough evidence to
        distinguish repository behavior from an upstream failure.

  - type: input
    id: image-tag
    attributes:
      label: Image tag
      placeholder: "v0.20.1-gb10.0"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Image fails to pull / digest mismatch
        - Container crashes on startup
        - vllm serve fails or errors
        - Smoke test failure
        - Wrong package version inside image
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        docker run --rm -it --gpus all --ipc=host --network host \
          ghcr.io/timothystewart6/vllm-gb10:v0.20.1-gb10.0 \
          vllm serve ...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behavior
      description: State the invariant that failed, what should have happened, and what happened instead.
    validations:
      required: true

  - type: input
    id: related-work
    attributes:
      label: Related issues, pull requests, or Actions run
      description: Link related open or closed work and the failing workflow run when applicable.
      placeholder: "https://github.com/timothystewart6/vllm-gb10/actions/runs/..."

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: input
    id: spark-firmware
    attributes:
      label: DGX Spark firmware version
      placeholder: "e.g. 1.2.3"

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues and pull requests.
          required: true
        - label: I confirmed this is specific to this image, GB10 build, or repository automation.
          required: true
