name: Version bump request
description: Request a newer version of vLLM, PyTorch, NCCL, FlashInfer, or another component
labels: ["bump"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - vLLM
        - PyTorch / TorchVision / TorchAudio
        - NCCL
        - FlashInfer
        - CUDA base image
        - Triton
        - Ray
        - Other
    validations:
      required: true

  - type: input
    id: current-version
    attributes:
      label: Current version (from versions.env)
      placeholder: "v0.20.1"
    validations:
      required: true

  - type: input
    id: requested-version
    attributes:
      label: Requested version
      placeholder: "v0.21.0"
    validations:
      required: true

  - type: input
    id: upstream-release
    attributes:
      label: Upstream release link
      placeholder: "https://github.com/vllm-project/vllm/releases/tag/v0.21.0"

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything relevant - breaking changes, GB10-specific concerns, etc.
