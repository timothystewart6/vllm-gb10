# .github/dependabot.yml
#
# Tracks GitHub Actions only. Docker, Python, and apt deps are pinned
# manually in versions.env and regenerated by scripts/bump.sh - Dependabot
# must NOT touch those.
#
# Dependabot opens a PR with the new SHA and the human-readable tag comment
# updated. Review, confirm CI is green, merge.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
