# .github/workflows/build-image.yaml
#
# Builds the vllm-gb10 image on the self-hosted DGX Spark runner.
#
# Phase 3 state: push=false. Flip to true in the 'publish' job (Phase 3
# step 18) once the first run is confirmed green.
#
# Actions are pinned by SHA per the SPEC. Update SHAs via Dependabot
# (added in Phase 5) - do NOT track floating tags.
#
# actions/checkout             v4.2.2  => 11bd71901bbe5b1630ceea73d27597364c9af683
# docker/setup-buildx-action   v3.10.0 => b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2
# docker/login-action          v3.3.0  => 9780b0c442fbb1117ed29e0efdff1e18412f7567
# docker/metadata-action       v5.7.0  => 902fa8ec7d6ecbf8d84d538b9b233a880e428804
# docker/build-push-action     v6.15.0 => 471d1dc4e07e5cdedd4c2171150001c434f0b7a4
# actions/upload-artifact      v4.6.2  => ea165f8d65b6e75b540449e92b4886f43607fa02

name: Build vllm-gb10 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - versions.env
      - locks/**
      - scripts/**
      - checksums/**
      - .github/workflows/build-image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, ARM64, dgx-spark]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Source versions.env into GITHUB_ENV
        # Pass every non-comment, non-blank line directly.
        # Values may contain colons and slashes (URLs, digests) but not
        # newlines, so this is safe.
        run: |
          grep -v '^\s*#' versions.env | grep -v '^\s*$' >> "$GITHUB_ENV"

      - name: Set SOURCE_DATE_EPOCH from last commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Generate build-metadata.yaml
        run: |
          SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }} \
          bash scripts/render-metadata.sh > build-metadata.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804
        with:
          images: ghcr.io/timothystewart6/vllm-gb10
          # No :latest tag. No bare VLLM_REF tag (it would be mutable).
          # Exact gb10 revision + short SHA only.
          tags: |
            type=raw,value=${{ env.VLLM_REF }}-gb10.${{ env.GB10_BUILD }}
            type=sha,prefix=sha-,format=short

      - name: Build image (push=false, iterate until green)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4
        with:
          context: .
          target: runner
          platforms: linux/arm64
          # Phase 3: push=false. Flip to true in the publish job (step 18).
          push: false
          load: true
          # provenance/sbom must be false with load=true for large images.
          # With provenance=true, buildx exports an OCI manifest-list and streams
          # it back to the Docker daemon; for images this size the BuildKit gRPC
          # session times out before the transfer completes (context deadline
          # exceeded). provenance=false forces plain Docker image format, which
          # loads without the session-level timeout.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vllm-gb10
          cache-to: type=gha,mode=max,scope=vllm-gb10
          build-args: |
            CUDA_BASE_IMAGE=${{ env.CUDA_BASE_IMAGE }}
            CUDA_BASE_DIGEST=${{ env.CUDA_BASE_DIGEST }}
            GB10_BUILD=${{ env.GB10_BUILD }}
            UV_VERSION=${{ env.UV_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            TORCHVISION_VERSION=${{ env.TORCHVISION_VERSION }}
            TORCHAUDIO_VERSION=${{ env.TORCHAUDIO_VERSION }}
            TRITON_VERSION=${{ env.TRITON_VERSION }}
            PYTORCH_INDEX_URL=${{ env.PYTORCH_INDEX_URL }}
            PYPI_INDEX_URL=${{ env.PYPI_INDEX_URL }}
            NVSHMEM_VERSION=${{ env.NVSHMEM_VERSION }}
            TVM_FFI_VERSION=${{ env.TVM_FFI_VERSION }}
            TILELANG_VERSION=${{ env.TILELANG_VERSION }}
            NUMBA_VERSION=${{ env.NUMBA_VERSION }}
            NCCL_REPO=${{ env.NCCL_REPO }}
            NCCL_REF=${{ env.NCCL_REF }}
            NCCL_COMMIT=${{ env.NCCL_COMMIT }}
            VLLM_REPO=${{ env.VLLM_REPO }}
            VLLM_REF=${{ env.VLLM_REF }}
            VLLM_COMMIT=${{ env.VLLM_COMMIT }}
            FLASHINFER_REPO=${{ env.FLASHINFER_REPO }}
            FLASHINFER_REF=${{ env.FLASHINFER_REF }}
            FLASHINFER_COMMIT=${{ env.FLASHINFER_COMMIT }}
            RAY_VERSION=${{ env.RAY_VERSION }}
            FASTSAFETENSORS_VERSION=${{ env.FASTSAFETENSORS_VERSION }}
            INSTANTTENSOR_VERSION=${{ env.INSTANTTENSOR_VERSION }}
            TORCH_CUDA_ARCH_LIST=${{ env.TORCH_CUDA_ARCH_LIST }}
            FLASHINFER_CUDA_ARCH_LIST=${{ env.FLASHINFER_CUDA_ARCH_LIST }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

      - name: Extract build artifacts from image
        # Extract the authoritative artifact set for the verify-reproducible
        # workflow to compare. pip freeze and apt versions are runtime reads;
        # the others were written during the build into /workspace/build-artifacts/.
        run: |
          IMAGE="ghcr.io/timothystewart6/vllm-gb10:${{ env.VLLM_REF }}-gb10.${{ env.GB10_BUILD }}"
          mkdir -p /tmp/build-artifacts
          docker run --rm "${IMAGE}" cat /workspace/build-artifacts/wheel-sha256.txt \
            > /tmp/build-artifacts/wheel-sha256.txt
          docker run --rm "${IMAGE}" cat /workspace/build-artifacts/nccl-sha256.txt \
            > /tmp/build-artifacts/nccl-sha256.txt
          docker run --rm "${IMAGE}" cat /workspace/build-metadata.yaml \
            > /tmp/build-artifacts/build-metadata.yaml
          docker run --rm "${IMAGE}" python3 -m pip freeze \
            > /tmp/build-artifacts/pip-freeze.txt
          docker run --rm "${IMAGE}" \
            bash -c "dpkg-query -W -f='\${Package}=\${Version}\n' | sort" \
            > /tmp/build-artifacts/apt-versions.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-artifacts-${{ github.sha }}
          path: /tmp/build-artifacts/
          if-no-files-found: error
