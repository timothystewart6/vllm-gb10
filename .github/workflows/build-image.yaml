# .github/workflows/build-image.yaml
#
# Builds the vllm-gb10 image on the self-hosted DGX Spark runner.
# Pushes to GHCR on every green build of main.
#
# Actions are pinned by SHA per the SPEC. Update SHAs via Dependabot
# (added in Phase 5) - do NOT track floating tags.
#
# Action SHAs are reviewed and allowlisted in tests/test-ci-security-policy.py.
#
# Job layout (split so re-runs of cheap stages don't require a 1-hour rebuild):
#
#   build   -> compile + push image to GHCR (the expensive job; cached to
#              ghcr.io/.../:buildcache so re-runs are near-instant hits).
#   verify  -> pull image, smoke test, extract artifacts.
#   release -> push git release tag, mirror image to Docker Hub.
#
# Build jobs run on the GB10 runner (class label `gb10`). The runner is
# nvidia-spark-01 - the ASUS GX10 nodes were retired from the build pipeline;
# their runners were removed and the production model containers there are
# managed out-of-band.
#
# Re-run "verify" or "release" from the Actions UI to retry without rebuilding.

name: Build vllm-gb10 image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - versions.env
      - locks/**
      - scripts/render-metadata.sh
      - scripts/build-args.sh
      - checksums/**

concurrency:
  group: build-image-model-lifecycle
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64, gb10]
    outputs:
      vllm_ref: ${{ steps.vars.outputs.vllm_ref }}
      gb10_build: ${{ steps.vars.outputs.gb10_build }}
      cuda_short: ${{ steps.vars.outputs.cuda_short }}
      torch_short: ${{ steps.vars.outputs.torch_short }}
      canonical_tag: ${{ steps.vars.outputs.canonical_tag }}
      shorthand_tag: ${{ steps.vars.outputs.shorthand_tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}

    steps:
      - name: Require main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Refusing to run self-hosted jobs from a non-main workflow ref."
            exit 1
          fi

      - name: Checkout
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - name: Validate versions.env
        run: python3 scripts/versions_env.py versions.env

      - name: Source versions.env into GITHUB_ENV
        # Validation constrains keys and values before they reach GITHUB_ENV.
        run: |
          grep -v '^\s*#' versions.env | grep -v '^\s*$' >> "$GITHUB_ENV"

      - name: Set SOURCE_DATE_EPOCH from last build-affecting commit
        # Key to the last commit that touched versions.env or locks/ so that
        # unrelated commits (docs, Dockerfile fixes, scripts) do not bust the
        # expensive builder stage layer caches (flashinfer, vllm, rust).
        # verify-reproducible.yaml uses the same formula so both builds in the
        # reproducibility check produce identical SOURCE_DATE_EPOCH values.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- versions.env locks/)" >> "$GITHUB_ENV"

      - name: Detect available CPU cores
        run: echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: Generate build-metadata.yaml
        run: |
          SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }} \
          bash scripts/render-metadata.sh > build-metadata.yaml

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        # docker/login-action v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag variables
        id: vars
        # Derive cu<major.minor> from CUDA_BASE_IMAGE, torch<major.minor>
        # from TORCH_VERSION, and emit all four target tag strings as
        # step outputs so downstream jobs can reuse them without
        # re-sourcing versions.env.
        run: |
          CUDA_VERSION="${CUDA_BASE_IMAGE#*cuda:}"
          CUDA_VERSION="${CUDA_VERSION%%-*}"
          CUDA_SHORT="cu${CUDA_VERSION%.*}"
          TORCH_SHORT="torch$(echo "$TORCH_VERSION" | cut -d. -f1-2)"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          CANONICAL="${VLLM_REF}-gb10.${GB10_BUILD}"
          SHORTHAND="${VLLM_REF}-${CUDA_SHORT}-${TORCH_SHORT}-gb10.${GB10_BUILD}"

          {
            echo "vllm_ref=${VLLM_REF}"
            echo "gb10_build=${GB10_BUILD}"
            echo "cuda_short=${CUDA_SHORT}"
            echo "torch_short=${TORCH_SHORT}"
            echo "canonical_tag=${CANONICAL}"
            echo "shorthand_tag=${SHORTHAND}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

          # Also export for the metadata-action step in this job.
          echo "CUDA_SHORT=${CUDA_SHORT}" >> "$GITHUB_ENV"
          echo "TORCH_SHORT=${TORCH_SHORT}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        # docker/metadata-action v6
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/timothystewart6/vllm-gb10
          # Three immutable tags are published per build, all pinned to this
          # exact build's digest:
          #   1. Canonical immutable: VLLM_REF-gb10.N (verify + release use it)
          #   2. Component shorthand: VLLM_REF-cu<x.y>-torch<x.y>-gb10.N
          #   3. sha-<short_sha> (immutable, useful for exact-build references)
          # `latest` is deliberately NOT pushed here. It is the mutable
          # release-facing pointer and is promoted only after the verify job
          # passes (see the release job's "Promote latest (post-verify)" step),
          # so a runtime-broken image can never replace `latest`.
          tags: |
            type=raw,value=${{ env.VLLM_REF }}-gb10.${{ env.GB10_BUILD }}
            type=raw,value=${{ env.VLLM_REF }}-${{ env.CUDA_SHORT }}-${{ env.TORCH_SHORT }}-gb10.${{ env.GB10_BUILD }}
            type=sha,prefix=sha-,format=short

      - name: Build and push image to GHCR
        # docker/build-push-action v7
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: true
          # load: false because with load+push BuildKit serializes the OCI
          # tarball twice (once to the local docker daemon, once to GHCR).
          # For multi-GB images this doubles I/O and previously stalled at
          # "#33 sending tarball". Downstream jobs pull from GHCR.
          load: false
          # provenance/sbom kept false for now to keep the pushed image as a
          # plain Docker manifest. Attestations can be enabled in a later phase.
          provenance: false
          sbom: false
          # Registry-based BuildKit cache pushed to a dedicated ':buildcache'
          # tag on GHCR. Survives runner restarts and buildx builder rotation,
          # so re-running a failed job (e.g. transient push denial) reuses all
          # layers and finishes in minutes instead of an hour.
          # mode=max stores intermediate layers too (not just the final image).
          cache-from: type=registry,ref=ghcr.io/timothystewart6/vllm-gb10:buildcache
          cache-to: type=registry,ref=ghcr.io/timothystewart6/vllm-gb10:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CUDA_BASE_IMAGE=${{ env.CUDA_BASE_IMAGE }}
            CUDA_BASE_DIGEST=${{ env.CUDA_BASE_DIGEST }}
            BUILD_JOBS=${{ env.BUILD_JOBS }}
            GB10_BUILD=${{ env.GB10_BUILD }}
            UV_VERSION=${{ env.UV_VERSION }}
            TORCH_VERSION=${{ env.TORCH_VERSION }}
            TORCHVISION_VERSION=${{ env.TORCHVISION_VERSION }}
            TORCHAUDIO_VERSION=${{ env.TORCHAUDIO_VERSION }}
            TRITON_VERSION=${{ env.TRITON_VERSION }}
            PYTORCH_INDEX_URL=${{ env.PYTORCH_INDEX_URL }}
            PYPI_INDEX_URL=${{ env.PYPI_INDEX_URL }}
            FLASHINFER_INDEX_URL=${{ env.FLASHINFER_INDEX_URL }}
            NVSHMEM_VERSION=${{ env.NVSHMEM_VERSION }}
            TVM_FFI_VERSION=${{ env.TVM_FFI_VERSION }}
            TILELANG_VERSION=${{ env.TILELANG_VERSION }}
            NUMBA_VERSION=${{ env.NUMBA_VERSION }}
            NCCL_REPO=${{ env.NCCL_REPO }}
            NCCL_REF=${{ env.NCCL_REF }}
            NCCL_COMMIT=${{ env.NCCL_COMMIT }}
            VLLM_REPO=${{ env.VLLM_REPO }}
            VLLM_REF=${{ env.VLLM_REF }}
            VLLM_COMMIT=${{ env.VLLM_COMMIT }}
            FLASHINFER_REPO=${{ env.FLASHINFER_REPO }}
            FLASHINFER_REF=${{ env.FLASHINFER_REF }}
            FLASHINFER_COMMIT=${{ env.FLASHINFER_COMMIT }}
            RAY_VERSION=${{ env.RAY_VERSION }}
            FASTSAFETENSORS_VERSION=${{ env.FASTSAFETENSORS_VERSION }}
            INSTANTTENSOR_VERSION=${{ env.INSTANTTENSOR_VERSION }}
            TORCH_CUDA_ARCH_LIST=${{ env.TORCH_CUDA_ARCH_LIST }}
            FLASHINFER_CUDA_ARCH_LIST=${{ env.FLASHINFER_CUDA_ARCH_LIST }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}

  verify:
    needs: build
    runs-on: [self-hosted, linux, ARM64, gb10]
    env:
      CANONICAL_IMAGE: ghcr.io/timothystewart6/vllm-gb10:${{ needs.build.outputs.canonical_tag }}

    steps:
      - name: Checkout
        # Needed for tests/smoke-test.sh source.
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Log in to GHCR
        # Required to pull the freshly-pushed image (may be private).
        # docker/login-action v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${CANONICAL_IMAGE}"

      - name: Smoke test
        # Runs tests/smoke-test.sh inside the pulled image.
        # The runner IS a DGX Spark so --gpus all works here.
        # Multiple docker containers can share GPU access; the running vllm
        # service does not prevent the smoke test from seeing the GPU.
        run: |
          docker run --rm --gpus all \
            -v "${{ github.workspace }}/tests/smoke-test.sh:/tmp/smoke-test.sh:ro" \
            "${CANONICAL_IMAGE}" bash /tmp/smoke-test.sh

      - name: Serve and bench the built image
        # Boots the freshly-built image, proves it serves the catalog of cached
        # models across a deterministic functional test plus per-model optional
        # suites (tool calling, reasoning, multimodal, spec-decode), then runs
        # a llama-benchy workload against each served model from inside the
        # container (verify/run-verify.sh). The models come from verify/models.json
        # - each entry carries its own serve flags/tuning and a `tests` map, so
        # dense and MoE/reasoning/multimodal models each get the right flags and
        # the right suites. Deliberately uses only what the gha-runner user has
        # (docker, curl, jq, python3, NFS model cache): no sudo, no host
        # llama-benchy. Bench numbers land in verify/results/ (bind-mounted at
        # /results) for artifact upload.
        # verify/docker-compose.yaml defaults HF_CACHE to the NFS model share,
        # where the pinned model snapshots are already cached.
        env:
          # Actions env values are not shell-expanded, so the literal
          # ${CANONICAL_IMAGE} would be passed through verbatim. Reference the
          # job-level env with an Actions expression instead.
          IMAGE: ${{ env.CANONICAL_IMAGE }}
          VLLM_PORT: "8010"
          HF_CACHE: /mnt/llm/models/huggingface
          VLLM_CACHE: /mnt/llm/vllm-compile-cache
          HEALTH_TIMEOUT_MIN: "25"
        run: bash "${GITHUB_WORKSPACE}/verify/run-verify.sh"

      - name: Upload serve and bench results
        # Preserve the chat + benchy JSON from the serve+bench step as a CI
        # artifact so results can be compared across builds without rerunning
        # the benchmark. Same action already used for build artifacts.
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: serve-bench-results-${{ github.sha }}
          path: verify/results/
          if-no-files-found: error

      - name: Extract build artifacts from image
        # Extract the authoritative artifact set for the verify-reproducible
        # workflow to compare. pip freeze and apt versions are runtime reads;
        # the others were written during the build into /workspace/build-artifacts/.
        run: |
          mkdir -p /tmp/build-artifacts
          docker run --rm "${CANONICAL_IMAGE}" cat /workspace/build-artifacts/wheel-sha256.txt \
            > /tmp/build-artifacts/wheel-sha256.txt
          docker run --rm "${CANONICAL_IMAGE}" cat /workspace/build-artifacts/nccl-sha256.txt \
            > /tmp/build-artifacts/nccl-sha256.txt
          docker run --rm "${CANONICAL_IMAGE}" cat /workspace/build-metadata.yaml \
            > /tmp/build-artifacts/build-metadata.yaml
          docker run --rm "${CANONICAL_IMAGE}" python3 -m pip freeze \
            > /tmp/build-artifacts/pip-freeze.txt
          docker run --rm "${CANONICAL_IMAGE}" \
            bash -c "dpkg-query -W -f='\${Package}=\${Version}\n' | sort" \
            > /tmp/build-artifacts/apt-versions.txt

      - name: Upload build artifacts
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-artifacts-${{ github.sha }}
          path: /tmp/build-artifacts/
          if-no-files-found: error

  release:
    needs: [build, verify]
    runs-on: [self-hosted, linux, ARM64, gb10]
    env:
      VLLM_REF: ${{ needs.build.outputs.vllm_ref }}
      GB10_BUILD: ${{ needs.build.outputs.gb10_build }}
      CANONICAL: ${{ needs.build.outputs.canonical_tag }}
      SHORTHAND: ${{ needs.build.outputs.shorthand_tag }}
      SHA_TAG: ${{ needs.build.outputs.sha_tag }}

    steps:
      - name: Checkout
        # Needed for `git tag` / `git push` of the release tag.
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Release notes compare the current tag with the previous release.
          fetch-depth: 0

      - name: Log in to GHCR
        # docker/login-action v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # docker/login-action v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: timothystewart6
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        # Ensures the image is in the local daemon even if this job lands
        # on a different runner than `verify` (defensive).
        run: docker pull "ghcr.io/timothystewart6/vllm-gb10:${CANONICAL}"

      - name: Promote latest (post-verify)
        # `latest` is the mutable release-facing pointer. The build job does
        # not push it; it is published here, gated on this job having passed
        # (this job `needs: [build, verify]`), so a runtime-broken image can
        # never replace `latest`. The canonical tag was rebuilt in the Pull
        # image step above; re-tag and push it as `latest` now.
        run: |
          set -euo pipefail
          SRC="ghcr.io/timothystewart6/vllm-gb10"
          docker tag "${SRC}:${CANONICAL}" "${SRC}:latest"
          docker push "${SRC}:latest"

      - name: Download serve and bench results
        # The verify job uploaded the per-model bench + meta JSON as an
        # artifact. Pull it back so the release notes can include the compact
        # model-verification report derived from this exact build's run.
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: serve-bench-results-${{ github.sha }}
          path: verify/results/

      - name: Push release tag
        # Pushing a tag with GITHUB_TOKEN does NOT trigger other workflows
        # (GitHub anti-recursion), so create-release.yaml won't fire here.
        # We push the tag now and create the release in the next step using
        # softprops/action-gh-release. Idempotent on re-runs.
        run: |
          set -euo pipefail
          TAG="${VLLM_REF}-gb10.${GB10_BUILD}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally."
          else
            git tag "${TAG}"
          fi
          git push origin "${TAG}" || echo "Tag push skipped (likely already on remote)."

      - name: Generate release notes
        # Release notes are produced by a shared script so create-release.yaml
        # (manual fallback) stays in sync with the inline release here.
        # VERIFY_RESULTS_DIR points at the serve+bench artifact so the body
        # carries the compact model-verification report for this build.
        env:
          TAG: ${{ needs.build.outputs.canonical_tag }}
        run: |
          export VERIFY_RESULTS_DIR="${GITHUB_WORKSPACE}/verify/results"
          bash scripts/generate-release-notes.sh > /tmp/release-notes.md

      - name: Bundle verify results
        # Archive the per-model verify JSONs (meta/bench/bench-conc/matrix/
        # suite-results/specdecode) plus the per-model server logs into a
        # single tarball so each release carries one clean, self-describing
        # raw-data artifact for later analysis. The JSONs and logs were
        # downloaded from the serve-bench-results artifact into verify/results/
        # just above. Transient fail-*.json records (which can capture raw
        # error output) are excluded.
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/verify"
          tar -czf "/tmp/verify-results-${TAG}.tar.gz" --exclude='results/fail-*.json' results/*.json results/*.log
        env:
          TAG: ${{ needs.build.outputs.canonical_tag }}

      - name: Create GitHub Release
        # action-gh-release is the de facto standard. It is idempotent: if a
        # release for the tag already exists, it updates it in place rather
        # than failing - so re-running this job is safe.
        # softprops/action-gh-release v3
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.build.outputs.canonical_tag }}
          name: vllm-gb10 ${{ needs.build.outputs.canonical_tag }}
          body_path: /tmp/release-notes.md
          # `files` is glob-based and expanded by the action itself (no shell
          # interpolation), so match the tag-named results tarball from the
          # bundle step above with a wildcard.
          files: /tmp/verify-results-*.tar.gz

      - name: Mirror to Docker Hub
        # Re-tag the pulled canonical image with all four target names and
        # push to Docker Hub. All four tags share the same digest on GHCR,
        # so a single pull is enough.
        run: |
          SRC="ghcr.io/timothystewart6/vllm-gb10"
          DST="timothystewart6/vllm-gb10"
          for TAG in "${CANONICAL}" "${SHORTHAND}" "latest" "${SHA_TAG}"; do
            docker tag "${SRC}:${CANONICAL}" "${DST}:${TAG}"
            docker push "${DST}:${TAG}"
          done
