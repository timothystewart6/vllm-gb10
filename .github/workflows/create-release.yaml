# .github/workflows/create-release.yaml
#
# Creates a GitHub Release whenever a v*-gb10.* tag is pushed.
# Runs on ubuntu-latest (GitHub-hosted) - no GPU or aarch64 needed.
# The release body is a markdown table of every pinned component from
# versions.env, so users can diff two builds without pulling either image.
#
# Typical flow:
#   1. CI green on main.
#   2. git tag v0.20.1-gb10.0 && git push origin v0.20.1-gb10.0
#   3. This workflow fires, creates the release with the component table.
#
# actions/checkout v6.0.2 => de0fac2e4500dabe0009e67214ff5f5447ce83dd

name: Create release on tag

on:
  push:
    tags:
      - 'v*-gb10.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/generate-release-notes.sh > /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "vllm-gb10 ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
