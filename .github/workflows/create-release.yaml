# .github/workflows/create-release.yaml
#
# Creates a GitHub Release whenever a v*-gb10.* tag is pushed.
# Runs on ubuntu-latest (GitHub-hosted) - no GPU or aarch64 needed.
# The release body is a markdown table of every pinned component from
# versions.env, so users can diff two builds without pulling either image.
#
# Typical flow:
#   1. CI green on main.
#   2. git tag v0.20.1-gb10.0 && git push origin v0.20.1-gb10.0
#   3. This workflow fires, creates the release with the component table.
#
# Action SHAs are reviewed and allowlisted in tests/test-ci-security-policy.py.

name: Create release on tag

on:
  push:
    tags:
      - 'v*-gb10.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Release notes compare the current tag with the previous release.
          fetch-depth: 0
          persist-credentials: false

      - name: Require tag commit on main
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "Refusing to execute release code from a tag outside main."
            exit 1
          fi

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/generate-release-notes.sh > /tmp/release-notes.md

      - name: Create GitHub Release
        # action-gh-release is idempotent: if the release for this tag
        # already exists (e.g. created inline by build-image.yaml), it
        # updates it in place rather than failing.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          name: vllm-gb10 ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
