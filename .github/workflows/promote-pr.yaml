# .github/workflows/promote-pr.yaml
#
# Promotes an approved fork pull request to an integration branch and opens a
# replacement pull request. The implementation lives in a testable script
# checked out from the trusted workflow SHA on main.
#
# Implements #65. Follow-up to PR #64 and docs/contributor-ci-security.md.
#
# actions/checkout pinned SHA is allowlisted in tests/test-ci-security-policy.py.

name: Promote fork PR

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Fork pull request number to promote
        required: true
        type: number

concurrency:
  group: promote-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions:
  # The promotion gate reads the app identity and conclusion of the required
  # check before granting the integration branch any repository state.
  checks: read
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Promote reviewed fork pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_PR_NUMBER: ${{ inputs.pr_number }}
        # Keep security decisions in reviewed, unit-testable code instead of
        # embedding orchestration in shell that is difficult to exercise.
        run: python3 scripts/promote_pr.py
