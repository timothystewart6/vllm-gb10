# .github/workflows/run-bump.yaml
#
# Imports reviewed declarative inputs from an exact commit, then runs trusted
# scripts from main on the persistent DGX Spark. Contributor scripts, workflows,
# and Dockerfile instructions are never executed by this workflow.
# Maintainer runbook: docs/contributor-ci-security.md
#
# actions/checkout pinned SHA is allowlisted in tests/test-ci-security-policy.py.

name: Run bump.sh

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Upstream integration branch to update
        required: true
        type: string
      sha:
        description: Exact 40-character commit SHA reviewed by a maintainer
        required: true
        type: string

concurrency:
  group: bump-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: [self-hosted, linux, ARM64, dgx-spark]
    timeout-minutes: 30
    env:
      APPROVED_BRANCH: ${{ inputs.branch }}
      APPROVED_SHA: ${{ inputs.sha }}

    steps:
      - name: Require dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "Refusing to run: dispatch this workflow from main."
            exit 1
          fi

      - name: Validate approved target
        run: |
          if [[ ! "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to run: sha must be a lowercase 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$APPROVED_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] ||
             [[ "$APPROVED_BRANCH" == /* ]] ||
             [[ "$APPROVED_BRANCH" == */ ]] ||
             [[ "$APPROVED_BRANCH" == *..* ]]; then
            echo "Refusing to run: branch has an unsafe format."
            exit 1
          fi

      - name: Checkout exact trusted workflow revision
        # actions/checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify integration branch still points to approved SHA
        run: |
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/$APPROVED_BRANCH" | cut -f1)
          if [[ "$REMOTE_SHA" != "$APPROVED_SHA" ]]; then
            echo "Refusing to run: branch head does not match the reviewed SHA."
            echo "Expected: $APPROVED_SHA"
            echo "Actual:   $REMOTE_SHA"
            exit 1
          fi
          git fetch --no-tags origin "$APPROVED_SHA"

      - name: Create trusted generator worktree
        run: |
          GENERATOR_DIR=$(mktemp -d "${RUNNER_TEMP}/vllm-gb10-generator-XXXXXX")
          OUTPUT_DIR=$(mktemp -d "${RUNNER_TEMP}/vllm-gb10-output-XXXXXX")
          git worktree add --detach "$GENERATOR_DIR" "$GITHUB_SHA"
          {
            echo "GENERATOR_DIR=$GENERATOR_DIR"
            echo "OUTPUT_DIR=$OUTPUT_DIR"
          } >> "$GITHUB_ENV"

      - name: Import reviewed declarative inputs
        run: |
          git show "$APPROVED_SHA:versions.env" > "$GENERATOR_DIR/versions.env"
          git show "$APPROVED_SHA:Dockerfile" > "$GENERATOR_DIR/Dockerfile"
          git show "$APPROVED_SHA:locks/apt-sources.list" \
            > "$GENERATOR_DIR/locks/apt-sources.list"
          git show "$APPROVED_SHA:locks/apt-packages.txt" \
            > "$GENERATOR_DIR/locks/apt-packages.txt"

      - name: Validate imported inputs with trusted validators
        run: |
          python3 scripts/versions_env.py "$GENERATOR_DIR/versions.env"
          python3 scripts/validate-apt-inputs.py \
            "$GENERATOR_DIR/locks/apt-sources.list" \
            "$GENERATOR_DIR/locks/apt-packages.txt"

      - name: Run trusted bump.sh
        working-directory: ${{ env.GENERATOR_DIR }}
        run: bash scripts/bump.sh

      - name: Preserve generated outputs
        run: |
          cp "$GENERATOR_DIR/versions.env" "$OUTPUT_DIR/versions.env"
          cp -R "$GENERATOR_DIR/locks" "$OUTPUT_DIR/locks"
          python3 scripts/versions_env.py "$OUTPUT_DIR/versions.env"
          python3 scripts/validate-apt-inputs.py \
            "$OUTPUT_DIR/locks/apt-sources.list" \
            "$OUTPUT_DIR/locks/apt-packages.txt"
          (
            cd "$GENERATOR_DIR"
            python3 tests/test-lockfile-security.py
          )

      - name: Apply outputs to exact approved commit
        run: |
          git checkout --detach "$APPROVED_SHA"
          cp "$OUTPUT_DIR/versions.env" versions.env
          cp -R "$OUTPUT_DIR/locks/." locks/
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"

      - name: Validate generated changes
        run: |
          invalid_path=false
          while IFS= read -r -d '' path; do
            case "$path" in
              versions.env|locks/*) ;;
              *)
                printf 'Refusing unexpected generated path: %q\n' "$path"
                invalid_path=true
                ;;
            esac
          done < <(
            git diff --name-only -z
            git diff --cached --name-only -z
            git ls-files --others --exclude-standard -z
          )
          if [[ "$invalid_path" == true ]]; then
            exit 1
          fi
          if find locks -type l -print -quit | grep -q .; then
            echo "Refusing generated symlink under locks/."
            exit 1
          fi

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.env locks/
          if git diff --staged --quiet; then
            echo "Nothing changed. bump.sh was a no-op."
          else
            git -c core.hooksPath=/dev/null commit \
              -m "chore(bump): resolve SHAs and regenerate lockfiles"
          fi

      - name: Recheck branch and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/$APPROVED_BRANCH" | cut -f1)
          if [[ "$REMOTE_SHA" != "$APPROVED_SHA" ]]; then
            echo "Refusing to push: branch moved while bump.sh was running."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" = "$APPROVED_SHA" ]]; then
            echo "Nothing to push."
          else
            ASKPASS=$(mktemp "${RUNNER_TEMP}/git-askpass-XXXXXX")
            trap 'rm -f "$ASKPASS"' EXIT
            # Preserve these variables for expansion inside the helper.
            # shellcheck disable=SC2016
            printf '%s\n' \
              '#!/bin/sh' \
              'case "$1" in' \
              '  *Username*) printf "%s\n" "x-access-token" ;;' \
              '  *Password*) printf "%s\n" "$GH_TOKEN" ;;' \
              '  *) exit 1 ;;' \
              'esac' > "$ASKPASS"
            chmod 700 "$ASKPASS"
            GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 \
              git -c core.hooksPath=/dev/null \
              push origin "HEAD:refs/heads/$APPROVED_BRANCH"
          fi

      - name: Remove trusted generator worktree
        if: always()
        run: |
          if [[ -n "${GENERATOR_DIR:-}" ]]; then
            git worktree remove --force "$GENERATOR_DIR" || true
          fi
