# .github/workflows/test-release-notes.yaml
#
# Validates the release-notes diff logic against every realistic scenario.
# Runs on ubuntu-latest (no GPU or aarch64 needed) - just Python and git.
#
# The test harness simulates git tags and versions.env content to exercise
# all combinations of component changes, lockfile changes, and edge cases,
# then verifies the output is well-formed and correct.
#
# Action SHAs are reviewed and allowlisted in tests/test-ci-security-policy.py.

name: Test release notes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Fetch all history and tags so the test harness can simulate
          # tag lookups against real release tags.
          fetch-depth: 0

      - name: Run release-notes test harness
        run: python3 tests/test-release-notes-scenarios.py

      - name: Run update-check test harness
        run: python3 tests/test-check-updates.py

      - name: Run PR body generation test harness
        run: python3 tests/test-pr-body-generation.py

      - name: Run real-script integration tests
        run: python3 tests/test-script-integrations.py

      - name: Run duplicate PR check test harness
        run: python3 tests/test-check-duplicate-pr.py

      - name: Verify package index contract
        run: python3 tests/test-package-index-contract.py

      - name: Verify CI security policy
        run: python3 tests/test-ci-security-policy.py

      - name: Verify lockfile supply-chain policy
        run: python3 tests/test-lockfile-security.py

      - name: Verify deterministic lockfile comments
        run: python3 tests/test-lockfile-normalization.py

      - name: Validate versions.env security rules
        run: python3 tests/test-versions-env.py

      - name: Validate apt input security rules
        run: python3 tests/test-apt-inputs.py

      - name: Verify output is well-formed
        run: |
          OUTPUT=/tmp/test-release-notes-output.md

          # Count code fences - must be even (open + close pairs)
          # Lines that start with optional whitespace followed by exactly 3 backticks
          FENCES=$(grep -cE '^[[:space:]]*```' "$OUTPUT")
          if [ $((FENCES % 2)) -ne 0 ]; then
            echo "ERROR: Odd number of code fences ($FENCES) in output - markdown is broken."
            exit 1
          fi
          echo "OK: $FENCES code fences (all properly paired)"

          # Verify each scenario section exists
          for i in $(seq 1 16); do
            if ! grep -q "^## Scenario $i:" "$OUTPUT"; then
              echo "ERROR: Scenario $i section missing from output."
              exit 1
            fi
          done
          echo "OK: All 16 scenario sections present"

          # Verify no raw triple-backtick fences inside rendered output blocks
          # (they should be escaped with zero-width space)
          # shellcheck disable=SC2016
          INNER_FENCES=$(python3 -c 'import sys; print(open(sys.argv[1]).read().count("`\u200b``"))' "$OUTPUT")
          echo "OK: $INNER_FENCES inner code fences properly escaped"

      - name: Upload test output artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-scenarios-output
          path: /tmp/test-release-notes-output.md
