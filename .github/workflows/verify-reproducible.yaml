# .github/workflows/verify-reproducible.yaml
#
# Builds the same commit twice and compares the authoritative artifacts.
# Manual trigger only - run before going public and after structural changes.
#
# Build 1 uses the warm BuildKit layer cache.
# Build 2 uses no-cache to rebuild every layer from scratch, which is the
# meaningful reproducibility test: the final image digest can differ due to
# layer metadata, but the authoritative runtime artifacts must match.
#
# Authoritative artifacts (FAIL on diff):
#   nccl-sha256.txt     sha256 of the exported symbol table of libnccl.so.2
#                       (`nm -D --defined-only`, sorted). Robust against
#                       residual nvcc/ptxas byte variance on sm_121a while
#                       still catching ABI changes.
#   wheel-sha256.txt    Per-wheel hash. Pure wheels (flashinfer_cubin,
#                       flashinfer_python) use raw byte sha256. Compiled
#                       wheels (flashinfer_jit_cache, vllm) aggregate
#                       symbol-table hashes of every .so plus byte hashes
#                       of all non-.so files.
#   build-metadata.yaml all version pins plus repo SHA and build timestamp
#   pip-freeze.txt      pip freeze output from the runner image
#   apt-versions.txt    dpkg-query installed package list
#
# Non-authoritative (REPORT only, never a gate):
#   image digest - may differ due to layer mtimes/order
#
# Actions are pinned by SHA per the SPEC. Update via Dependabot (Phase 5).
#
# actions/checkout             v6.0.2  => de0fac2e4500dabe0009e67214ff5f5447ce83dd
# docker/setup-buildx-action   v4.1.0  => d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
# docker/build-push-action     v7.2.0  => f9f3042f7e2789586610d6e8b85c8f03e5195baf
# actions/upload-artifact      v7.0.1  => 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a

name: Verify reproducible build

on:
  workflow_dispatch:

# No packages: write needed - both builds are local only, never pushed.
concurrency:
  group: dgx-spark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, ARM64, dgx-spark]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Source versions.env into GITHUB_ENV
        run: |
          grep -v '^\s*#' versions.env | grep -v '^\s*$' >> "$GITHUB_ENV"

      - name: Set SOURCE_DATE_EPOCH from last build-affecting commit
        # Must use the same formula as build-image.yaml so the two builds
        # in this workflow produce identical SOURCE_DATE_EPOCH values.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- versions.env locks/)" >> "$GITHUB_ENV"

      - name: Generate build-metadata.yaml
        # Generated once on the host, identical for both builds.
        run: bash scripts/render-metadata.sh > build-metadata.yaml

      - name: Generate Docker build args
        id: build-args
        run: |
          {
            echo 'args<<BUILD_ARGS_EOF'
            scripts/build-args.sh | xargs -n2 | awk '{print $2}'
            echo "BUILD_JOBS=$(nproc)"
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      # ── Build 1 of 2 (warm BuildKit cache) ─────────────────────────────────
      - name: Build 1 of 2 (warm cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: false
          load: true
          # provenance/sbom must remain false while load=true is set.
          # See the comment in build-image.yaml for the full explanation.
          provenance: false
          sbom: false
          tags: vllm-gb10:verify-build1
          build-args: ${{ steps.build-args.outputs.args }}

      - name: Extract artifacts from build 1
        run: |
          mkdir -p /tmp/verify/build1
          docker run --rm vllm-gb10:verify-build1 \
            cat /workspace/build-artifacts/wheel-sha256.txt \
            > /tmp/verify/build1/wheel-sha256.txt
          docker run --rm vllm-gb10:verify-build1 \
            cat /workspace/build-artifacts/nccl-sha256.txt \
            > /tmp/verify/build1/nccl-sha256.txt
          docker run --rm vllm-gb10:verify-build1 \
            cat /workspace/build-metadata.yaml \
            > /tmp/verify/build1/build-metadata.yaml
          docker run --rm vllm-gb10:verify-build1 \
            python3 -m pip freeze \
            > /tmp/verify/build1/pip-freeze.txt
          docker run --rm vllm-gb10:verify-build1 \
            bash -c "dpkg-query -W -f='\${Package}=\${Version}\n' | sort" \
            > /tmp/verify/build1/apt-versions.txt
          docker inspect --format='{{.Id}}' vllm-gb10:verify-build1 \
            > /tmp/verify/build1/image-id.txt
          echo "Build 1 image ID: $(cat /tmp/verify/build1/image-id.txt)"

      - name: Remove build 1 image to free disk
        run: docker rmi vllm-gb10:verify-build1

      # ── Build 2 of 2 (no-cache - full rebuild from scratch) ────────────────
      - name: Build 2 of 2 (no-cache)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: false
          load: true
          provenance: false
          sbom: false
          # no-cache forces a full rebuild. This is the meaningful part of the
          # test: if build 2 produces the same authoritative artifacts as build
          # 1 without reusing any cached layers, the build is reproducible.
          no-cache: true
          tags: vllm-gb10:verify-build2
          build-args: ${{ steps.build-args.outputs.args }}

      - name: Extract artifacts from build 2
        run: |
          mkdir -p /tmp/verify/build2
          docker run --rm vllm-gb10:verify-build2 \
            cat /workspace/build-artifacts/wheel-sha256.txt \
            > /tmp/verify/build2/wheel-sha256.txt
          docker run --rm vllm-gb10:verify-build2 \
            cat /workspace/build-artifacts/nccl-sha256.txt \
            > /tmp/verify/build2/nccl-sha256.txt
          docker run --rm vllm-gb10:verify-build2 \
            cat /workspace/build-metadata.yaml \
            > /tmp/verify/build2/build-metadata.yaml
          docker run --rm vllm-gb10:verify-build2 \
            python3 -m pip freeze \
            > /tmp/verify/build2/pip-freeze.txt
          docker run --rm vllm-gb10:verify-build2 \
            bash -c "dpkg-query -W -f='\${Package}=\${Version}\n' | sort" \
            > /tmp/verify/build2/apt-versions.txt
          docker inspect --format='{{.Id}}' vllm-gb10:verify-build2 \
            > /tmp/verify/build2/image-id.txt
          echo "Build 2 image ID: $(cat /tmp/verify/build2/image-id.txt)"

      - name: Remove build 2 image
        run: docker rmi vllm-gb10:verify-build2

      # ── Compare ─────────────────────────────────────────────────────────────
      - name: Compare authoritative artifacts
        run: |
          FAILED=0

          # --- Fully authoritative: must match exactly ---
          for artifact in nccl-sha256.txt wheel-sha256.txt build-metadata.yaml pip-freeze.txt apt-versions.txt; do
            if diff -u \
                "/tmp/verify/build1/${artifact}" \
                "/tmp/verify/build2/${artifact}" \
                > "/tmp/verify/diff-${artifact}.txt" 2>&1
            then
              echo "PASS: ${artifact}"
            else
              echo "FAIL: ${artifact} differs between builds:"
              cat "/tmp/verify/diff-${artifact}.txt"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""

          # Image digest comparison - non-authoritative, report only.
          BUILD1_ID=$(cat /tmp/verify/build1/image-id.txt)
          BUILD2_ID=$(cat /tmp/verify/build2/image-id.txt)
          if [ "$BUILD1_ID" = "$BUILD2_ID" ]; then
            echo "INFO: image digests match (${BUILD1_ID})"
          else
            echo "INFO: image digests differ (expected - layer mtimes/order may differ)"
            echo "  build 1: ${BUILD1_ID}"
            echo "  build 2: ${BUILD2_ID}"
          fi

          echo ""
          if [ $FAILED -ne 0 ]; then
            echo "RESULT: reproducibility check FAILED (${FAILED} artifact(s) differ)"
            echo ""
            echo "Common causes:"
            echo "  - apt install missing a =<version> pin in locks/apt-packages.txt"
            echo "  - pip dep floating transitively (audit pip-freeze diff above)"
            echo "  - uv build embedding a wall-clock timestamp (check SOURCE_DATE_EPOCH)"
            echo "  - real ABI change in compiled wheel/.so (symbol added/removed/renamed)"
            exit 1
          fi

          echo "RESULT: all authoritative artifacts match - build is reproducible"

      - name: Upload artifacts and diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-reproducible-${{ github.run_id }}
          path: /tmp/verify/
          if-no-files-found: error
