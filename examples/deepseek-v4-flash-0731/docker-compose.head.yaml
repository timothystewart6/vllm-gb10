# Run on the HEAD node. Start this first, then the worker.
# API: http://HEAD_IP:8000/v1 (binds to all interfaces; firewall required).
services:
  vllm-ray-head:
    image: ${IMAGE:?Set IMAGE in .env}
    container_name: deepseek-v4-ray-head
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: "10.24gb"
    # Required by the reference two-node GB10 recipe. Only use on trusted hosts.
    privileged: true
    cap_add: [SYS_PTRACE]
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
    volumes:
      - ${HF_CACHE_DIR:?Set HF_CACHE_DIR}:/root/.cache/huggingface
      - ${RUNTIME_CACHE_DIR:?Set RUNTIME_CACHE_DIR}:/runtime-cache
      - ./start-head.sh:/opt/deepseek/start-head.sh:ro
    env_file: .env
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-0}
      HF_HUB_DISABLE_XET: "1"
      VLLM_HOST_IP: ${HEAD_IP:?Set HEAD_IP}
      UCX_NET_DEVICES: ${QSFP_IFACE:?Set QSFP_IFACE}
      NCCL_SOCKET_IFNAME: ${QSFP_IFACE}
      OMPI_MCA_btl_tcp_if_include: ${QSFP_IFACE}
      GLOO_SOCKET_IFNAME: ${QSFP_IFACE}
      TP_SOCKET_IFNAME: ${QSFP_IFACE}
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: ${IB_HCA:?Set IB_HCA}
      NCCL_IB_GID_INDEX: ${IB_GID_INDEX:?Set IB_GID_INDEX}
      NCCL_CROSS_NIC: "1"
      NCCL_DEBUG: WARN
      RAY_memory_monitor_refresh_ms: "0"
      RAY_num_prestart_python_workers: "0"
      RAY_object_store_memory: "1073741824"
      RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO: "0"
      MASTER_ADDR: ${HEAD_IP}
      MN_IF_NAME: ${QSFP_IFACE}
      OMP_NUM_THREADS: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TILELANG_CLEANUP_TEMP_FILES: "1"
      DG_JIT_USE_NVRTC: "0"
      DG_JIT_CACHE_DIR: /runtime-cache/deepgemm-cache
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD: "0"
      VLLM_ALLOW_SPEC_DEC_SAME_STEP_PREFIX_HIT: "2"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      VLLM_B12X_MOE_FP4_FORCE_A16: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "128"
      FLASHINFER_WORKSPACE_BASE: /runtime-cache/flashinfer
      TILELANG_CACHE_DIR: /runtime-cache/tilelang
      TORCH_EXTENSIONS_DIR: /runtime-cache/torch-extensions
      TORCHINDUCTOR_CACHE_DIR: /runtime-cache/torchinductor-cache
      TRITON_CACHE_DIR: /runtime-cache/triton-cache
      VLLM_CACHE_ROOT: /runtime-cache/vllm-cache
    entrypoint: ["/bin/bash", "/opt/deepseek/start-head.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 3600s
